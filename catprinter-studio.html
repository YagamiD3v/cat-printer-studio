const CRC8=((()=>{const t=new Uint8Array(256);for(let i=0;i<256;i++){let v=i;for(let j=0;j<8;j++)v=(v&0x80)?((v<<1)^0x07):(v<<1);t[i]=v&0xFF;}return t;}))();
function crc8(d){let c=0;for(const b of d)c=CRC8[(c^b)&0xFF];return c&0xFF;}
function pkt(cmd,data){const d=data instanceof Uint8Array?Array.from(data):(data||[]);return new Uint8Array([0x51,0x78,cmd,0x00,d.length&0xFF,(d.length>>8)&0xFF,...d,crc8(d),0xFF]);}
const delay=ms=>new Promise(r=>setTimeout(r,ms));
async function sendB(bytes){if(!charWrite)throw new Error('Non connecté');for(let i=0;i<bytes.length;i+=MTU){await charWrite.writeValueWithoutResponse(bytes.slice(i,i+MTU));await delay(8);}}
async function sendCmd(cmd,data){await sendB(pkt(cmd,data));}

async function bleConnect(){
  setDot('wait');setTxt('Recherche…');
  try{
    device=await navigator.bluetooth.requestDevice({
      filters:[{namePrefix:'MX10'},{namePrefix:'MX08'},{namePrefix:'MX06'},{namePrefix:'MX05'},{namePrefix:'MX'},{namePrefix:'GB01'},{namePrefix:'GB02'},{namePrefix:'GB03'},{namePrefix:'GT01'},{namePrefix:'YT01'}],
      optionalServices:[SVC_UUID]
    });
    device.addEventListener('gattserverdisconnected',onDc);
    const srv=await device.gatt.connect();
    const svc=await srv.getPrimaryService(SVC_UUID);
    charWrite=await svc.getCharacteristic(CHR_WRITE);
    try{const n=await svc.getCharacteristic(CHR_NOTIF);await n.startNotifications();n.addEventListener('characteristicvaluechanged',onNotif);}catch(_){}
    setDot('on');setTxt(device.name||'Connecté');log('Connecté : '+(device.name||'?'),'ok');setUI(true);
  }catch(e){setDot('');setTxt('Non connecté');log('Erreur : '+e.message,'err');}
}
function onNotif(e){log('← '+Array.from(new Uint8Array(e.target.value.buffer)).map(b=>b.toString(16).padStart(2,'0')).join(' '),'info');}
function onDc(){device=null;charWrite=null;setDot('');setTxt('Déconnecté');setUI(false);log('Déconnecté','err');}
async function bleDisconnect(){if(device?.gatt?.connected)device.gatt.disconnect();}
async function feedPaper(){await sendCmd(CMD_FEED,[120,0]);log('Avancement papier','ok');}
function setDot(s){document.getElementById('dot').className='dot '+s;}
function setTxt(t){document.getElementById('status-text').textContent=t;}

function log(msg,cls=''){const b=document.getElementById('log');const l=document.createElement('div');l.className=cls;l.textContent='› '+msg;b.appendChild(l);b.scrollTop=b.scrollHeight;}

async function doPrint(){
  if(!charWrite)return;
  const p=getGlobalParams();
  const bw=dither(flattenForPrint(),p.algo);
  const rows=imageToRows(bw);
  document.getElementById('btn-print').disabled=true;
  const pw=document.getElementById('pgwrap'),pb=document.getElementById('pg');
  pw.classList.add('on');pb.style.width='0%';
  try{
    log('Init énergie='+p.energy,'info');
    await sendCmd(CMD_ENERGY,[p.energy&0xFF,(p.energy>>8)&0xFF]);await delay(30);
    await sendCmd(CMD_SPEED,[0x20]);await delay(30);
    await sendCmd(CMD_QUALITY,[0x33]);await delay(30);

    // Avance papier AVANT
    if(p.feedBefore>0){
      await sendCmd(CMD_FEED,[p.feedBefore&0xFF,(p.feedBefore>>8)&0xFF]);
      log('Avance avant : '+p.feedBefore+' lignes','info');
      await delay(50);
    }

    log('Envoi bitmap… '+rows.length+' lignes','info');
    for(let i=0;i<rows.length;i++){
      await sendCmd(CMD_DRAW,rows[i]);
      if(i%8===0){pb.style.width=Math.round((i/rows.length)*100)+'%';await delay(0);}
    }
    pb.style.width='100%';await delay(200);

    // Avance papier APRÈS
    if(p.feedAfter>0){
      await sendCmd(CMD_FEED,[p.feedAfter&0xFF,(p.feedAfter>>8)&0xFF]);
      log('Avance après : '+p.feedAfter+' lignes','ok');
    }
    log('✓ Terminé !','ok');
  }catch(e){log('✗ '+e.message,'err');}
  pw.classList.remove('on');pb.style.width='0%';
  document.getElementById('btn-print').disabled=false;
}

// COPIER / COLLER
// ═══════════════════════════════════════════
function copyBlock(){
  if(!selected) return;
  const b=getB(selected);
  if(!b) return;
  clipboard = JSON.parse(JSON.stringify({...b, img:null, _imgRef: b.type==='image'?b.img:null}));
  if(b.type==='image') clipboard._imgRef=b.img; // garder la ref image
}

function pasteBlock(){
  if(!clipboard) return;
  const b={...clipboard, id:uid(), x:clipboard.x+16, y:clipboard.y+16};
  if(clipboard._imgRef) b.img=clipboard._imgRef;
  delete b._imgRef;
  // Mettre à jour le clipboard pour que le prochain coller décale encore
  clipboard={...clipboard, x:clipboard.x+16, y:clipboard.y+16};
  addBlock(b);
}

const resizeHandleW_el=document.getElementById('canvas-resize-handle-w');

resizeHandleW_el.addEventListener('mousedown',e=>{
  e.preventDefault();
  resizingCanvasW=true;
  resizeCanvasStartX=e.clientX;
  resizeCanvasStartW=canvasManualW;
  resizeHandleW_el.classList.add('dragging');
});

document.addEventListener('mousemove',e=>{
  if(resizingCanvas){
    const dy=(e.clientY-resizeCanvasStartY)/zoom;
    canvasManualH=Math.max(50, Math.round(resizeCanvasStartH+dy));
    render();
  }
  if(resizingCanvasW){
    const dx=(e.clientX-resizeCanvasStartX)/zoom;
    canvasManualW=Math.max(50, Math.min(PRINT_W, Math.round(resizeCanvasStartW+dx)));
    render();
  }
});

document.addEventListener('mouseup',e=>{
  if(resizingCanvas){ resizingCanvas=false; resizeHandle_el.classList.remove('dragging'); }
  if(resizingCanvasW){ resizingCanvasW=false; resizeHandleW_el.classList.remove('dragging'); }
});

// Raccourcis clavier
document.addEventListener('keydown',e=>{
  // Ne pas intercepter si on est dans un champ de saisie ou dans l'éditeur richtext
  if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;
  if(e.target.isContentEditable)return;
  if(document.getElementById('richtext-ov'))return;
  if(e.key==='v'||e.key==='V')setTool('select');
  if(e.key==='t'||e.key==='T')setTool('text');
  if(e.key==='r'||e.key==='R')setTool('rect');
  if(e.key==='e'||e.key==='E')setTool('ellipse');
  if(e.key==='l'||e.key==='L')setTool('line');
  if(e.key==='p'||e.key==='P')setTool('pencil');
  if(e.key==='x'||e.key==='X'){
    if(selected){const b=getB(selected);if(b&&b.type==='richtext'){openRichTextEditor(b);return;}}
    setTool('richtext');
  }
  if(e.key==='k'||e.key==='K') openIconPicker(null);
  if((e.key==='Delete'||e.key==='Backspace')&&selected)delBlock(selected);
  if(e.ctrlKey&&e.key==='z'){e.preventDefault();undo();}
  if(e.ctrlKey&&(e.key==='y'||e.key==='Y')){e.preventDefault();redo();}
  if(e.ctrlKey&&e.key==='c'){e.preventDefault();copyBlock();}
  if(e.ctrlKey&&e.key==='v'){e.preventDefault();pasteBlock();}
  if(selected){
    const b=getB(selected);if(!b)return;
    const step=e.shiftKey?10:1;
    if(e.key==='ArrowLeft'){e.preventDefault();if(b.type==='line'){b.x-=step;b.x2-=step;}else b.x-=step;render();syncPosFields();}
    if(e.key==='ArrowRight'){e.preventDefault();if(b.type==='line'){b.x+=step;b.x2+=step;}else b.x+=step;render();syncPosFields();}
    if(e.key==='ArrowUp'){e.preventDefault();if(b.type==='line'){b.y-=step;b.y2-=step;}else b.y-=step;render();syncPosFields();}
    if(e.key==='ArrowDown'){e.preventDefault();if(b.type==='line'){b.y+=step;b.y2+=step;}else b.y+=step;render();syncPosFields();}
  }
});

// ICON PICKER — Lucide
// ═══════════════════════════════════════════

// Cache des icônes Lucide chargées : { name -> [{tag, attrs}] }
const lucideCache={};
let lucideNames=null; // liste complète des noms

// Charge la liste des icônes depuis l'API Lucide (index JSON)
async function loadLucideNames(){
  if(lucideNames) return lucideNames;
  try{
    const r=await fetch('https://unpkg.com/lucide-static@latest/font/lucide.css');
    // Fallback: on utilise le JSON d'icônes
    const r2=await fetch('https://unpkg.com/lucide@latest/dist/lucide.js');
    // Encore mieux: utiliser l'index de lucide-static
  } catch(_){}
  // Approche robuste : liste les noms depuis l'arbre SVG du CDN icons manifest
  try {
    const resp=await fetch('https://unpkg.com/lucide-static@latest/icons/');
    // unpkg ne fournit pas de listing navigable direct, on utilise le manifest npm
  } catch(_){}
  // Méthode la plus fiable : charger le manifest JSON de lucide
  const resp=await fetch('https://unpkg.com/lucide@latest/dist/esm/icons/index.js');
  const text=await resp.text();
  // Extraire les noms d'exports
  const matches=[...text.matchAll(/export \{[^}]+\}/g)];
  const names=new Set();
  [...text.matchAll(/(['"`])([a-z][a-z0-9-]+)\1/g)].forEach(m=>names.add(m[2]));
  // fallback si rien trouvé
  if(names.size<10){
    // Utiliser le fichier JSON du package
    const r2=await fetch('https://unpkg.com/lucide-static@latest/icon-nodes.json');
    const data=await r2.json();
    lucideNames=Object.keys(data).sort();
    // Précacher les paths
    for(const [name, nodes] of Object.entries(data)){
      lucideCache[name]=nodes.map(([tag, attrs])=>({tag, attrs}));
    }
    return lucideNames;
  }
  lucideNames=[...names].sort();
  return lucideNames;
}

// Charge le SVG d'une icône et retourne [{tag,attrs}]
async function loadLucideIcon(name){
  if(lucideCache[name]) return lucideCache[name];
  // Depuis icon-nodes.json si déjà chargé
  const resp=await fetch(`https://unpkg.com/lucide-static@latest/icons/${name}.svg`);
  const text=await resp.text();
  const parser=new DOMParser();
  const doc=parser.parseFromString(text,'image/svg+xml');
  const svg=doc.querySelector('svg');
  const paths=[];
  svg&&svg.childNodes.forEach(node=>{
    if(node.nodeType!==1)return;
    const tag=node.tagName.toLowerCase();
    const attrs={};
    for(const attr of node.attributes) attrs[attr.name]=attr.value;
    paths.push({tag, attrs});
  });
  lucideCache[name]=paths;
  return paths;
}

// Rendu preview d'une icône dans un canvas 32x32
function renderIconPreview(canvas32, paths, color='#000000'){
  const c=canvas32.getContext('2d');
  const sz=canvas32.width; // taille réelle du canvas (ex: 44 pour affichage 22px)
  c.clearRect(0,0,sz,sz);
  const sc=sz/24;
  c.save();c.scale(sc,sc);
  c.strokeStyle=color;c.lineWidth=2;c.lineCap='round';c.lineJoin='round';c.fillStyle='none';
  for(const el of paths){
    const a=el.attrs||{};
    if(el.tag==='path'&&a.d){
      const p=new Path2D(a.d);
      if(a.fill&&a.fill!=='none'){c.fillStyle=a.fill==='currentColor'?color:a.fill;c.fill(p);}
      else{c.stroke(p);}
    } else if(el.tag==='circle'){
      c.beginPath();c.arc(+a.cx,+a.cy,+a.r,0,Math.PI*2);c.stroke();
    } else if(el.tag==='line'){
      c.beginPath();c.moveTo(+a.x1,+a.y1);c.lineTo(+a.x2,+a.y2);c.stroke();
    } else if(el.tag==='polyline'||el.tag==='polygon'){
      const pts=(a.points||'').trim().split(/[\s,]+/).map(Number);
      c.beginPath();for(let i=0;i<pts.length;i+=2)i===0?c.moveTo(pts[i],pts[i+1]):c.lineTo(pts[i],pts[i+1]);
      if(el.tag==='polygon')c.closePath();c.stroke();
    } else if(el.tag==='rect'){
      c.strokeRect(+a.x,+a.y,+a.width,+a.height);
    } else if(el.tag==='ellipse'){
      c.beginPath();c.ellipse(+a.cx,+a.cy,+a.rx,+a.ry,0,0,Math.PI*2);c.stroke();
    }
  }
  c.restore();
}

// Ouvre le picker. Si `targetBlock` est fourni, remplace son icône.
function openIconPicker(targetBlock){
  document.getElementById('icon-picker-ov')?.remove();

  const overlay=document.createElement('div');
  overlay.id='icon-picker-ov';
  overlay.className='icon-picker-overlay';

  const modal=document.createElement('div');
  modal.className='icon-picker-modal';

  // Header
  const header=document.createElement('div');
  header.className='icon-picker-header';
  header.innerHTML=`
    <span class="icon-picker-header-title">Icônes Lucide</span>
    <input class="icon-picker-search" id="ip-search" type="text" placeholder="Rechercher une icône…" autocomplete="off" spellcheck="false">
    <span class="icon-picker-count" id="ip-count"></span>`;
  modal.appendChild(header);

  // Grid
  const grid=document.createElement('div');
  grid.className='icon-picker-grid';
  grid.id='ip-grid';
  modal.appendChild(grid);

  // Footer
  const footer=document.createElement('div');
  footer.className='icon-picker-footer';
  footer.innerHTML=`
    <div class="icon-picker-preview" id="ip-preview"><svg viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" width="20" height="20"><circle cx="12" cy="12" r="10"/></svg></div>
    <span class="icon-picker-sel-name" id="ip-sel-name">Sélectionnez une icône</span>
    <button id="ip-cancel" style="padding:.4rem .9rem;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:.8rem;cursor:pointer">Annuler</button>
    <button id="ip-ok" style="padding:.4rem .9rem;border-radius:6px;border:none;background:var(--accent);color:#0e0e0f;font-size:.8rem;font-weight:600;cursor:pointer" disabled>Insérer</button>`;
  modal.appendChild(footer);
  overlay.appendChild(modal);
  document.body.appendChild(overlay);

  let selectedName=null;
  let selectedPaths=null;
  let allNames=[];
  let iconNodesMap={};

  const searchEl=document.getElementById('ip-search');
  const countEl=document.getElementById('ip-count');
  const okBtn=document.getElementById('ip-ok');
  const selNameEl=document.getElementById('ip-sel-name');
  const previewEl=document.getElementById('ip-preview');

  // Fermeture
  const close=()=>overlay.remove();
  document.getElementById('ip-cancel').onclick=close;
  overlay.addEventListener('mousedown',e=>{if(e.target===overlay)close();});
  overlay.addEventListener('keydown',e=>{if(e.key==='Escape')close();});

  // OK
  okBtn.onclick=()=>{
    if(!selectedName||!selectedPaths) return;
    if(targetBlock){
      targetBlock.iconName=selectedName;
      targetBlock.svgPaths=selectedPaths;
      targetBlock._label=selectedName;
      saveHist(); render(); updateLayers(); buildProps();
    } else {
      const cx=Math.max(10, Math.round(PRINT_W/2-32));
      const cy=20;
      makeIcon(selectedName, selectedPaths, cx, cy);
    }
    close();
  };

  // Sélection d'une icône dans la grille
  function selectIcon(name, paths, cell, cellCanvas){
    selectedName=name; selectedPaths=paths;
    // Remettre les anciens sélectionnés en couleur normale
    grid.querySelectorAll('.icon-cell.selected').forEach(c=>{
      c.classList.remove('selected');
      const oldCv=c.querySelector('canvas');
      if(oldCv) renderIconPreview(oldCv, iconNodesMap[c.title]||[], '#b0aec8');
    });
    cell.classList.add('selected');
    // Repeindre en jaune accent
    if(cellCanvas) renderIconPreview(cellCanvas, paths, '#f5c542');
    selNameEl.textContent=name;
    // Preview footer
    previewEl.innerHTML='';
    const cv=document.createElement('canvas');cv.width=56;cv.height=56;cv.style.cssText='width:28px;height:28px;display:block;';
    renderIconPreview(cv, paths, '#f0ede8');
    previewEl.appendChild(cv);
    okBtn.disabled=false;
  }

  // Construction de la grille avec les noms filtrés
  function buildGrid(names){
    grid.innerHTML='';
    countEl.textContent=names.length+' icônes';
    if(names.length===0){
      grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:2rem;font-family:'DM Mono',monospace;font-size:.75rem;color:var(--muted)">Aucune icône trouvée</div>`;
      return;
    }
    // On affiche par lots pour ne pas bloquer l'UI
    const CHUNK=80;
    let offset=0;
    function renderChunk(){
      const slice=names.slice(offset, offset+CHUNK);
      slice.forEach(name=>{
        const cell=document.createElement('div');
        cell.className='icon-cell';
        cell.title=name;
        // Canvas preview (2× résolution pour netteté)
        const cv=document.createElement('canvas');cv.width=56;cv.height=56;cv.style.cssText='width:28px;height:28px;display:block;';
        const paths=iconNodesMap[name]||[];
        renderIconPreview(cv, paths, '#b0aec8');
        const nameSpan=document.createElement('div');
        nameSpan.className='icon-cell-name';
        nameSpan.textContent=name;
        cell.appendChild(cv);cell.appendChild(nameSpan);
        // Repaint canvas au hover / sélection
        cell.addEventListener('mouseenter',()=>{
          if(!cell.classList.contains('selected')) renderIconPreview(cv, paths, '#f0ede8');
        });
        cell.addEventListener('mouseleave',()=>{
          if(!cell.classList.contains('selected')) renderIconPreview(cv, paths, '#b0aec8');
        });
        cell.addEventListener('click',()=>selectIcon(name, paths, cell, cv));
        grid.appendChild(cell);
      });
      offset+=CHUNK;
      if(offset<names.length) requestAnimationFrame(renderChunk);
    }
    renderChunk();
  }

  // Filtre de recherche
  let searchTimer=null;
  searchEl.addEventListener('input',()=>{
    clearTimeout(searchTimer);
    searchTimer=setTimeout(()=>{
      const q=searchEl.value.trim().toLowerCase();
      const filtered=q?allNames.filter(n=>n.includes(q)):allNames;
      buildGrid(filtered);
    }, 120);
  });

  // Chargement
  grid.innerHTML=`<div class="icon-picker-loading" style="grid-column:1/-1"><div class="icon-picker-spinner"></div> Chargement des icônes…</div>`;

  (async()=>{
    try{
      // Charger icon-nodes.json (source la plus complète + paths déjà parsés)
      const resp=await fetch('https://unpkg.com/lucide-static@latest/icon-nodes.json');
      if(!resp.ok) throw new Error('HTTP '+resp.status);
      const data=await resp.json();
      iconNodesMap={};
      for(const [name, nodes] of Object.entries(data)){
        iconNodesMap[name]=nodes.map(([tag, attrs])=>({tag, attrs:{...attrs}}));
        lucideCache[name]=iconNodesMap[name];
      }
      allNames=Object.keys(iconNodesMap).sort();
      lucideNames=allNames;
      buildGrid(allNames);
      searchEl.focus();
    } catch(err){
      grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:2rem;font-family:'DM Mono',monospace;font-size:.75rem;color:var(--err)">Erreur de chargement.<br>${err.message}</div>`;
    }
  })();
}
